name: Drone image

on:
  push:
    branches: [main]
    paths: ["docker/**", "host/cshow/wire.py", "px4/airframes/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/maxx-akela/clover-show-sim-drone:latest
            ghcr.io/maxx-akela/clover-show-sim-drone:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
