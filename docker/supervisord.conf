[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0777

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
priority=1
autorestart=true

[program:avahi]
command=/usr/sbin/avahi-daemon --no-chroot --no-rlimits
priority=2
autorestart=true
startsecs=2

[program:web]
command=/usr/sbin/nginx -g "daemon off;" -c /etc/nginx/nginx.conf
priority=2
autorestart=true

[program:roscore]
command=/opt/clover-show/ros-env roscore
user=pi
priority=10
autorestart=true
stdout_logfile=/var/log/clover-show/roscore.log
redirect_stderr=true

[program:ros-params]
command=/opt/clover-show/ros-env /opt/clover-show/ros-params.sh
user=pi
priority=20
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/var/log/clover-show/ros-params.log
redirect_stderr=true

[program:sim-net]
command=/opt/clover-show/sim-net.sh
priority=30
autorestart=true
stdout_logfile=/var/log/clover-show/sim-net.log
redirect_stderr=true

[program:sim-bridge]
command=/opt/clover-show/ros-env python3 /opt/clover-show/bridge/bridge_container.py
user=pi
priority=30
autorestart=true
stdout_logfile=/var/log/clover-show/sim-bridge.log
redirect_stderr=true

[program:led]
command=/opt/clover-show/ros-env python3 /opt/clover-show/bridge/fake_led.py
user=pi
priority=30
autorestart=true
stdout_logfile=/var/log/clover-show/led.log
redirect_stderr=true

[program:px4]
command=/opt/clover-show/run-px4.sh
user=pi
priority=40
autorestart=true
startsecs=3
stopsignal=INT
stdout_logfile=/var/log/clover-show/px4.log
redirect_stderr=true

[program:clover]
command=/opt/clover-show/ros-env roslaunch /opt/clover-show/sim.launch --wait --screen --skip-log-check
user=pi
priority=50
autostart=false
autorestart=true
stopsignal=INT
stopasgroup=true
stdout_logfile=/var/log/clover.log
redirect_stderr=true

[program:clever-show]
command=/opt/clover-show/ros-env python3 /home/pi/clever-show/drone/client.py
directory=/home/pi/clever-show/drone
user=pi
priority=60
autostart=false
autorestart=true
stopasgroup=true
stdout_logfile=/var/log/clever-show.log
redirect_stderr=true

[program:autostart]
command=/opt/clover-show/autostart.sh
priority=90
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/var/log/clover-show/autostart.log
redirect_stderr=true
