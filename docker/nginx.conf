worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/clover-show/nginx-error.log;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    server {
        listen 80 default_server;
        root /home/pi/.ros/www;
        index index.html;
        disable_symlinks off;
    }
}
